<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0F0F0E">
<title>Tanishk's Blog</title>
<meta name="description" content="Reports, explainers and political opinion.">
<link rel="icon" href="favicon.png">
<script>try{if(localStorage.getItem('theme')==='day')document.documentElement.dataset.theme='day'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,800;1,6..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div id="progress"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="sprites" aria-hidden="true"></div>
<div id="wipe" aria-hidden="true"></div>

<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="gate-box">
    <div class="gate-art" id="gateArt" aria-hidden="true"></div>
    <p class="kick">Tanishk's Blog</p>
    <h2 id="gateTitle">Reports, explainers &amp; political opinion</h2>
    <p class="gate-sub">Best read with sound on.</p>
    <div class="gate-actions">
      <button id="gOn" class="btn" type="button">Enter with sound ♪</button>
      <button id="gOff" class="btn ghost" type="button">Enter silent</button>
    </div>
  </div>
</div>

<div id="menu" hidden role="dialog" aria-modal="true" aria-label="Menu">
  <div class="menu-top">
    <span class="kick">Menu</span>
    <button id="menuClose" class="btn small" type="button">Close ✕</button>
  </div>
  <nav id="menuList"></nav>
  <div id="menuFoot"></div>
</div>

<div class="topbar">
  <div class="tb-l"><span id="tbDate"></span><span id="tbTime"></span><span id="tbWx"></span></div>
  <div class="tb-r">
    <button id="snd" class="btn small" type="button" aria-pressed="false">♪ Sound off</button>
    <button id="hap" class="btn small" type="button" hidden>Haptics on</button>
    <button id="theme" class="btn small" type="button">Light ◑</button>
  </div>
</div>

<header class="site-header">
  <a class="brand" href="#/"><span class="brand-text">Tanishk's Blog</span><span class="cursor">_</span></a>
  <nav class="nav" aria-label="Main">
    <a href="#/">Home</a>
    <a href="#/archive">Writing</a>
    <a href="#/about">About</a>
    <a href="#/transparency">Transparency</a>
    <a href="#/social">Social</a>
  </nav>
  <button id="menuBtn" class="btn small" type="button" aria-expanded="false" aria-controls="menu">☰ Menu</button>
</header>

<div class="ticker" aria-label="Live ticker"><div class="ticker-track" id="ticker"></div></div>

<main id="app"></main>

<footer class="foot" id="foot"></footer>

<script src="config.js?v=4"></script>
<script src="script.js?v=4"></script>
</body>
</html>
